name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ['24.18.0']

    env:
      # No migrate/seed in CI — schema/data are applied manually in Supabase SQL Editor.
      SESSION_SECRET: local-ci-session-secret-value-32chars-min
      NUXT_PUBLIC_PLATFORM_DOMAIN: sandiwa.localhost
      NUXT_PUBLIC_TENANT_ROUTING: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
