services:
  postgres:
    image: postgres:16
    container_name: sandiwa-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: sandiwa
      POSTGRES_PASSWORD: sandiwa
      POSTGRES_DB: sandiwa_os
    volumes:
      - sandiwa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sandiwa -d sandiwa_os']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sandiwa_pgdata:
